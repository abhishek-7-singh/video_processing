[project]
name = "video-sentiment"
version = "0.1.0"
description = "Local speaker-level aspect sentiment for discussion videos."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "imageio-ffmpeg>=0.5",
  "yt-dlp>=2024.1.0",
  "streamlit>=1.40",
]

[project.optional-dependencies]
ml = [
  "whisperx>=3.7.2",
  "transformers>=4.48",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
video-sentiment = "video_sentiment.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
